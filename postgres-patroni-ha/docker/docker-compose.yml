services:
  etcd1: &etcd
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd1
    command: ["etcd","--name=etcd1","--data-dir=/etcd-data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://etcd1:2379","--listen-peer-urls=http://0.0.0.0:2380","--initial-advertise-peer-urls=http://etcd1:2380","--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380","--initial-cluster-state=new","--initial-cluster-token=postgres-ha-etcd"]
    volumes: ["etcd1-data:/etcd-data"]
  etcd2:
    <<: *etcd
    hostname: etcd2
    command: ["etcd","--name=etcd2","--data-dir=/etcd-data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://etcd2:2379","--listen-peer-urls=http://0.0.0.0:2380","--initial-advertise-peer-urls=http://etcd2:2380","--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380","--initial-cluster-state=new","--initial-cluster-token=postgres-ha-etcd"]
    volumes: ["etcd2-data:/etcd-data"]
  etcd3:
    <<: *etcd
    hostname: etcd3
    command: ["etcd","--name=etcd3","--data-dir=/etcd-data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://etcd3:2379","--listen-peer-urls=http://0.0.0.0:2380","--initial-advertise-peer-urls=http://etcd3:2380","--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380","--initial-cluster-state=new","--initial-cluster-token=postgres-ha-etcd"]
    volumes: ["etcd3-data:/etcd-data"]
  postgres1: &pg
    build: .
    hostname: postgres1
    environment: {PATRONI_NAME: postgres1, PATRONI_RESTAPI_CONNECT_ADDRESS: "postgres1:8008", PATRONI_POSTGRESQL_CONNECT_ADDRESS: "postgres1:5432"}
    volumes: ["postgres1-data:/var/lib/postgresql/data", "./patroni.yml:/etc/patroni/patroni.yml:ro"]
    depends_on: [etcd1, etcd2, etcd3]
  postgres2:
    <<: *pg
    hostname: postgres2
    environment: {PATRONI_NAME: postgres2, PATRONI_RESTAPI_CONNECT_ADDRESS: "postgres2:8008", PATRONI_POSTGRESQL_CONNECT_ADDRESS: "postgres2:5432"}
    volumes: ["postgres2-data:/var/lib/postgresql/data", "./patroni.yml:/etc/patroni/patroni.yml:ro"]
  postgres3:
    <<: *pg
    hostname: postgres3
    environment: {PATRONI_NAME: postgres3, PATRONI_RESTAPI_CONNECT_ADDRESS: "postgres3:8008", PATRONI_POSTGRESQL_CONNECT_ADDRESS: "postgres3:5432"}
    volumes: ["postgres3-data:/var/lib/postgresql/data", "./patroni.yml:/etc/patroni/patroni.yml:ro"]
  haproxy:
    image: haproxy:3.2-alpine
    ports: ["5000:5000", "7000:7000"]
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [postgres1, postgres2, postgres3]
  client:
    image: postgres:17-bookworm
    command: ["sleep", "infinity"]
    environment: {PGPASSWORD: postgres123}
    depends_on: [haproxy]
volumes:
  etcd1-data: {}
  etcd2-data: {}
  etcd3-data: {}
  postgres1-data: {}
  postgres2-data: {}
  postgres3-data: {}
