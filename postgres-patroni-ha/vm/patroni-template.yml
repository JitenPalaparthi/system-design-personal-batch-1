# Replace NODE_NAME and NODE_IP on each DB VM.
scope: postgres-ha
namespace: /service/
name: NODE_NAME
restapi:
  listen: 0.0.0.0:8008
  connect_address: NODE_IP:8008
etcd3:
  hosts: 192.168.56.11:2379,192.168.56.12:2379,192.168.56.13:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
  initdb: [encoding: UTF8, data-checksums]
  pg_hba:
    - host replication replicator 192.168.56.0/24 scram-sha-256
    - host all all 192.168.56.0/24 scram-sha-256
postgresql:
  listen: 0.0.0.0:5432
  connect_address: NODE_IP:5432
  data_dir: /var/lib/postgresql/patroni
  authentication:
    replication: {username: replicator, password: repl123}
    superuser: {username: postgres, password: postgres123}
  parameters:
    wal_level: replica
    hot_standby: 'on'
    max_wal_senders: 10
    max_replication_slots: 10
