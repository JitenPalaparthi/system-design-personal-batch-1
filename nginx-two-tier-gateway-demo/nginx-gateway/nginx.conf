events {}
http {
  log_format gatewaylog '$remote_addr [$time_local] "$request" $status '
                        'route=$uri upstream=$upstream_addr request_id=$request_id';
  access_log /var/log/nginx/access.log gatewaylog;

  # Simple gateway-level rate limiting for demonstration.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream go_api {
    server go-lb:80;
    keepalive 16;
  }

  upstream python_api {
    server python-lb:80;
    keepalive 16;
  }

  server {
    listen 80;
    server_tokens off;

    add_header X-Gateway "nginx-api-gateway" always;

    location = /gateway-health {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx-gateway"}\n';
    }

    # /api/go/items -> /items at the Go load-balancer.
    location /api/go/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Gateway-Request-ID $request_id;
      proxy_pass http://go_api/;
    }

    # /api/python/items -> /items at the Python load-balancer.
    location /api/python/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Gateway-Request-ID $request_id;
      proxy_pass http://python_api/;
    }

    location / {
      default_type application/json;
      return 404 '{"error":"unknown gateway route","try":["/api/go/health","/api/python/health"]}\n';
    }
  }
}
