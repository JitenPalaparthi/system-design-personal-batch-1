global
  log stdout format raw local0

# L7 HTTP load balancer: understands HTTP and routes by URL path.
defaults
  log global
  timeout connect 3s
  timeout client 30s
  timeout server 30s

frontend l7_http
  bind *:8080
  mode http
  option httplog
  acl is_python path_beg /python
  acl is_go path_beg /go
  use_backend python_http if is_python
  use_backend go_http if is_go
  default_backend mixed_http

backend python_http
  mode http
  option httpchk GET /health
  server python python-service:8080 check

backend go_http
  mode http
  option httpchk GET /health
  server go go-service:8080 check

backend mixed_http
  mode http
  balance roundrobin
  option httpchk GET /health
  server python python-service:8080 check
  server go go-service:8080 check

# L4 TCP load balancer: HAProxy sees TCP streams, not HTTP routes.
frontend l4_tcp
  bind *:9000
  mode tcp
  option tcplog
  default_backend mixed_tcp

backend mixed_tcp
  mode tcp
  balance roundrobin
  option tcp-check
  server python python-service:8080 check
  server go go-service:8080 check
