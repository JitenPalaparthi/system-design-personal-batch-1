services:
  nats1:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["./nats/nats1.conf:/etc/nats/nats.conf:ro"]
    ports: ["4222:4222", "8222:8222"]

  nats2:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["./nats/nats2.conf:/etc/nats/nats.conf:ro"]
    ports: ["4223:4222", "8223:8222"]
    depends_on: [nats1]

  nats3:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["./nats/nats3.conf:/etc/nats/nats.conf:ro"]
    ports: ["4224:4222", "8224:8222"]
    depends_on: [nats1]
